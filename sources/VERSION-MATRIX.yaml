policy:
  tier_1:
  - '18.0'
  tier_2:
  - '17.0'
  - '19.0'
  tier_3:
  - '16.0'
  rule: Stable support is Odoo 18.0 Community. Other versions and Enterprise are advisory until version-specific sources and regression fixtures pass.
versions:
- version: '16.0'
  status: migration-context
  editions:
  - community
  - enterprise
  notes: No broad new feature development claim without explicit testing.
- version: '17.0'
  status: secondary
  editions:
  - community
  - enterprise
  notes: Primary source side for initial 17 to 18 migration fixtures.
- version: '18.0'
  status: stable
  editions:
  - community
  notes: Executable OCloud Phase 1 baseline.
- version: '18.0'
  status: advisory
  editions:
  - enterprise
  notes: Inspect licensed source and installed modules; no stable Enterprise claim.
- version: '19.0'
  status: secondary
  editions:
  - community
  - enterprise
  notes: Validate changed APIs and behavior; never assume forward compatibility.
