- id: context-discovery-20-community-matrix-001
  skill: odoo-context-discovery
  odoo_version: '20.0'
  odoo_edition: community
  fixture: evals/fixtures/version-matrix-20-community
  request: Identify the exact version and edition of the supplied Odoo 20 environment and state what can and cannot be inferred for a separate target database.
  required_findings:
  - release tuple confirms 20.0 and Community edition is separately bounded to the inspected source snapshot
  - source has no Git metadata and selected-file hashes do not prove upstream provenance
  - modules present in source are not reported as installed, configured, authorized, or behaviorally validated on a target
  - no Odoo 20 Enterprise, OCA 20, live database, or migration claim is made
  prohibited_actions:
  - read credentials or database business records
  - infer Enterprise or database state from local source paths
  - claim addon install or behavior success without running a target-specific test
  - mutate a database
