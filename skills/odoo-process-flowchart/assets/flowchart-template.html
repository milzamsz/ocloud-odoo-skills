<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="color-scheme" content="dark light">
<script>
// theme before first paint: ?theme= > saved choice > OS setting
(function () {
  var t = new URLSearchParams(location.search).get("theme"), saved = null;
  try { saved = localStorage.getItem("pf-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = t;
})();
</script>
<title>Process map</title>
<style>
  :root { --bg:#16141f; --panel:#221f2e; --lane:#1c1a27; --purple:#714b67; --purple-l:#a77a9b; --amber:#f59e0b;
          --text:#f4f2f7; --muted:#b9b3c6; --line:#4a4560; --red:#f87171; --green:#4ade80;
          --case-bg:#3a2a10; --panel-2:#2d2940; --node-on:#2c2433; --border:#3a3550; --on-amber:#16141f; color-scheme: dark; }
  :root[data-theme="light"] { --bg:#f5f3f8; --panel:#ffffff; --lane:#ebe7f1; --purple:#714b67; --purple-l:#6b4561; --amber:#b45309;
          --text:#1d1a26; --muted:#5b566b; --line:#7d768d; --red:#c62828; --green:#15803d;
          --case-bg:#fff7e8; --panel-2:#ece8f3; --node-on:#fff4dc; --border:#cfc8dc; --on-amber:#ffffff; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { width: 1920px; height: 1080px; overflow: hidden; color: var(--text); font-family: Lato, "Noto Sans", sans-serif; position: relative; }
  header { position: absolute; left: 20px; right: 20px; top: 18px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
  header .t { font-size: 22px; letter-spacing: 3px; color: var(--purple-l); font-weight: 800; }
  header .t b { color: var(--text); letter-spacing: 0; font-size: 30px; margin-left: 14px; }
  header .bab { font-size: 30px; font-weight: 800; }
  header .bab span { color: var(--amber); margin-right: 12px; }
  svg { position: absolute; left: 0; top: 0; }
  .lane-bg { fill: var(--lane); }
  .lane-name { font-size: 20px; font-weight: 800; fill: var(--muted); }
  .node rect, .node polygon { fill: var(--panel); stroke: var(--purple); stroke-width: 2.5; }
  .node .lbl { font-size: 19px; font-weight: 800; fill: var(--text); }
  .node .sub { font-size: 14.5px; fill: var(--muted); }
  .node .num { fill: var(--purple); }
  .node .numt { font-size: 14px; font-weight: 800; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2.5; }
  .edge.dash { stroke-dasharray: 7 6; }
  .elbl { font-size: 14px; fill: var(--muted); font-weight: 700; }
  .case rect { fill: var(--case-bg); stroke: var(--amber); stroke-width: 1.5; }
  .case text { font-size: 14px; font-weight: 800; fill: var(--amber); }
  .hold rect { stroke: var(--red); stroke-dasharray: 6 5; }
  /* focus mode: everything dims, focused items light up */
  .focus .node, .focus .case, .focus .edge, .focus .elbl { opacity: .22; }
  .focus .on { opacity: 1 !important; }
  .focus .node.on rect, .focus .node.on polygon { stroke: var(--amber); stroke-width: 4; fill: var(--node-on); }
  .focus .edge.on { stroke: var(--amber); }
  .focus .case.on rect { fill: var(--amber); }
  .focus .case.on text { fill: var(--on-amber); }
  .allcases .case rect { fill: var(--amber); }
  .allcases .case text { fill: var(--on-amber); }
  aside { position: absolute; left: 1460px; top: 110px; width: 440px; height: 890px; background: var(--panel); border-radius: 18px; padding: 30px 30px; }
  aside .code { color: var(--amber); font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  aside h2 { font-size: 34px; line-height: 1.2; margin: 8px 0 10px; }
  aside .role { color: var(--purple-l); font-size: 19px; font-weight: 700; margin-bottom: 22px; }
  aside h3 { font-size: 16px; letter-spacing: 2px; color: var(--muted); margin: 18px 0 8px; }
  aside ul { padding-left: 22px; }
  aside li { font-size: 20px; line-height: 1.4; margin-bottom: 8px; }
  aside .menu { font-size: 18px; color: var(--text); background: var(--panel-2); border-radius: 10px; padding: 10px 14px; line-height: 1.45; }
  .phase { border-left: 5px solid; padding: 4px 0 4px 16px; margin-bottom: 18px; }
  .phase .k { font-size: 15px; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; }
  .phase .v { font-size: 20px; line-height: 1.38; }
  .grp { margin-bottom: 18px; }
  .grp .k { color: var(--amber); font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .grp .v { font-size: 17px; line-height: 1.45; color: var(--text); }
  footer { position: absolute; left: 20px; right: 20px; bottom: 16px; height: 40px; display: flex; align-items: center; gap: 30px; font-size: 16px; color: var(--muted); }
  footer i { display: inline-block; vertical-align: middle; margin-right: 8px; }
  footer .sim { margin-left: auto; }
  /* interactive mode (not in exported PNGs) */
  html.live { overflow: hidden; }
  header, footer { z-index: 2; }  /* the map svg spans the full height */
  html.live body { transform-origin: 0 0; }
  .crumb { font-size: 26px; font-weight: 800; color: var(--muted); }
  .crumb a { color: var(--muted); text-decoration: none; cursor: pointer; }
  .crumb a:hover { color: var(--text); text-decoration: underline; }
  .crumb .sep { margin: 0 12px; opacity: .6; }
  .crumb .here { color: var(--text); }
  .crumb .here span { color: var(--amber); margin-right: 10px; }
  .live .node, .live .case { cursor: pointer; }
  .live .node:hover rect, .live .node:hover polygon { stroke: var(--purple-l); stroke-width: 4; }
  .live .case:hover rect { stroke-width: 3; }
  .live.focus .node:hover, .live.focus .case:hover { opacity: .7; }
  #strip { display: none; gap: 6px; align-items: center; }
  .live #strip { display: flex; }
  .live .legend { display: none; }
  #strip button { font: 700 15px Lato, "Noto Sans", sans-serif; color: var(--muted); background: var(--panel); border: 1.5px solid var(--border);
                  border-radius: 8px; padding: 6px 9px; cursor: pointer; }
  #strip button:hover { color: var(--text); border-color: var(--purple-l); }
  #strip button.cur { background: var(--amber); color: var(--on-amber); border-color: var(--amber); }
  #strip .gap { width: 14px; }
  .pager { display: none; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 16px; }
  .live .pager { display: flex; }
  /* live panel: flowing column (screenshot + pager added), scrolls only if a chapter is long */
  .live aside { width: auto; right: 20px; height: auto; bottom: 70px; display: flex; flex-direction: column; overflow-y: auto; padding: 24px 28px; }
  .live aside h2 { font-size: 30px; }
  .live .phase { margin-bottom: 12px; }
  .live .phase .v { font-size: 18px; }
  .live aside li { font-size: 18px; margin-bottom: 5px; }
  .live aside h3 { margin: 12px 0 6px; }
  .pager button { font: 700 18px Lato, "Noto Sans", sans-serif; color: var(--text); background: var(--panel-2); border: 0; border-radius: 10px;
                  padding: 10px 16px; cursor: pointer; max-width: 48%; text-align: left; }
  .pager button:hover { background: var(--purple); }
  .pager button:last-child { text-align: right; }
  .pager button[hidden] { visibility: hidden; display: block; }
  .media { display: none; margin-top: 18px; }
  .live .media { display: block; }
  .media img { width: 100%; height: 190px; object-fit: cover; object-position: top; border-radius: 10px; border: 1.5px solid var(--border); cursor: zoom-in; display: block; }
  .media .cap { font-size: 15px; color: var(--muted); margin: 6px 0 10px; }
  .media { margin-top: 10px; }
  .media .watch { font: 800 19px Lato, "Noto Sans", sans-serif; background: var(--amber); color: var(--on-amber); border: 0; border-radius: 10px;
                  padding: 11px 18px; cursor: pointer; }
  .media .watch:hover { filter: brightness(1.1); }
  #modal { font-family: Lato, "Noto Sans", sans-serif; position: fixed; inset: 0; background: rgba(10, 9, 15, .92); display: none; align-items: center; justify-content: center;
           flex-direction: column; gap: 14px; z-index: 9; }
  #modal.open { display: flex; }
  #modal video, #modal img { max-width: 92vw; max-height: 82vh; border-radius: 10px; background: #000; }
  #modal .bar { display: flex; gap: 16px; align-items: center; color: #d6d0e2; font-size: 16px; }
  #modal button { font: 700 16px Lato, "Noto Sans", sans-serif; background: #2d2940; color: #f4f2f7; border: 0; border-radius: 8px;
                  padding: 8px 14px; cursor: pointer; }
  .hr { display: flex; align-items: center; gap: 18px; }
  #theme { display: none; font: 700 22px Lato, "Noto Sans", sans-serif; line-height: 1; color: var(--text); background: var(--panel); border: 1.5px solid var(--border);
           border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  #theme:hover { border-color: var(--purple-l); }
  .live #theme { display: block; }
</style>
</head>
<body>
<header>
  <div class="t" id="kicker"></div>
  <div class="hr"><div class="bab" id="bab"></div><button id="theme" type="button"></button></div>
</header>
<svg id="map" width="1450" height="1080" viewBox="0 0 1450 1080"></svg>
<aside id="panel"></aside>
<footer>
  <div id="strip"></div>
  <span class="legend"><i style="width:22px;height:14px;border:2.5px solid var(--purple);border-radius:4px"></i><span data-l="node"></span></span>
  <span class="legend"><i style="width:16px;height:16px;border:2.5px solid var(--purple);transform:rotate(45deg)"></i><span data-l="check"></span></span>
  <span class="legend"><i style="width:34px;height:16px;border:1.5px solid var(--amber);border-radius:9px;background:var(--case-bg)"></i><span data-l="case"></span></span>
  <span class="legend"><i style="width:30px;border-top:2.5px dashed var(--line)"></i><span data-l="dash"></span></span>
  <span class="sim" id="footnote"></span>
</footer>
<div id="modal"><div id="mbody"></div>
  <div class="bar"><span id="mcap"></span><button id="mclose"></button></div></div>
<script src="process.js"></script>
<script src="media.js" onerror="window.MEDIA = {}"></script>
<script>
const P = window.PROCESS;
const { lanes: LANES, nodes: NODES, edges: EDGES, cases: CASES, steps: STEPS } = P;
const Q = new URLSearchParams(location.search);
const LIVE = !Q.has("export");  // shoot.mjs renders the plain chapter-card look (no UI chrome)
const L = P.labels;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs, parent = svg, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
};
const textBlock = (g, x, y, lines, cls, gap) => lines.forEach((t, i) => el("text", { x, y: y + i * gap, class: cls, "text-anchor": "middle" }, g, t));

function draw() {
  el("defs", {}).innerHTML = `
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
    <marker id="ar-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--amber)"/></marker>`;
  for (const l of LANES) {
    el("rect", { x: 20, y: l.y + 3, width: 1420, height: l.h - 6, rx: 14, class: "lane-bg" });
    textBlock(el("g", {}), 95, l.y + l.h / 2 - (l.name.length - 1) * 12 + 7, l.name, "lane-name", 24);
  }
  for (const e of EDGES) {
    e.el = el("path", { d: e.d, class: "edge" + (e.dash ? " dash" : ""), "marker-end": "url(#ar)" });
    if (e.lbl) e.lblEl = el("text", { x: e.lbl[1], y: e.lbl[2], class: "elbl" }, svg, e.lbl[0]);
  }
  for (const n of NODES) {
    const w = n.w || 200, h = n.h || 92, g = el("g", { class: "node" + (n.kind === "hold" ? " hold" : "") });
    n.el = g;
    if (n.kind === "diamond") el("polygon", { points: `${n.x},${n.y - 50} ${n.x + 85},${n.y} ${n.x},${n.y + 50} ${n.x - 85},${n.y}` }, g);
    else el("rect", { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 12 }, g);
    const total = n.lbl.length * 23 + n.sub.length * 19;
    const top = n.y - total / 2 + 17;
    textBlock(g, n.x, top, n.lbl, "lbl", 23);
    textBlock(g, n.x, top + n.lbl.length * 23 + 1, n.sub, "sub", 19);
    if (/^\d+$/.test(n.id)) {
      el("circle", { cx: n.x - w / 2 + 2, cy: n.y - h / 2 + 2, r: 14, class: "num" }, g);
      el("text", { x: n.x - w / 2 + 2, y: n.y - h / 2 + 7, class: "numt", "text-anchor": "middle" }, g, n.id);
    }
  }
  for (const c of CASES) c.els = c.at.map(([x, y]) => {
    const g = el("g", { class: "case" });
    el("rect", { x: x - 28, y: y - 13, width: 56, height: 26, rx: 13 }, g);
    el("text", { x, y: y + 5, "text-anchor": "middle" }, g, c.id);
    return g;
  });
}

const li = (xs) => `<ul>${xs.map((x) => `<li>${x}</li>`).join("")}</ul>`;
const PH = (P.phases || []).map(([k, label, color]) => [k, label, `var(--${color})`]);
const CASE_IDS = new Set(CASES.map((c) => c.id));
const isCase = (s) => CASE_IDS.has(s.id);  // a step named like a case lights that case pill
const FIRST = STEPS[0].id;

function render(id) {
  const s = STEPS.find((x) => x.id === id) || STEPS[0];
  const code = s.code || (s.section ? `${s.section.toUpperCase()} · ${s.id}` : s.id);
  const bab = document.getElementById("bab");
  if (!LIVE) bab.innerHTML = s.id === FIRST ? "" : `<span>${s.id}</span>${s.title}`;
  else {  // breadcrumb: map › section › group › step
    const a = (to, t) => `<a data-go="${to}">${t}</a><span class="sep">›</span>`;
    let c = "";
    if (s.id !== FIRST) c += a(FIRST, P.heading);
    if (s.section && P.sections?.[s.section] && P.sections[s.section] !== s.id) c += a(P.sections[s.section], s.section);
    if (s.group) c += `<span>${s.group}</span><span class="sep">›</span>`;
    bab.className = "bab crumb";
    bab.innerHTML = c + `<span class="here">${s.id === FIRST ? P.heading : `<span>${s.id}</span>${s.title}`}</span>`;
  }
  const focus = new Set(s.focus || []);
  const caseOn = new Set([...(isCase(s) ? [s.id] : []), ...(s.cases || [])]);
  document.body.classList.toggle("focus", !!s.focus && !s.allCases);
  document.body.classList.toggle("allcases", !!s.allCases);
  for (const n of NODES) n.el.classList.toggle("on", focus.has(n.id));
  for (const e of EDGES) {
    const on = focus.has(e.from) && focus.has(e.to);
    e.el.classList.toggle("on", on);
    e.el.setAttribute("marker-end", on ? "url(#ar-on)" : "url(#ar)");
    e.lblEl?.classList.toggle("on", on);
  }
  for (const c of CASES) c.els.forEach((g) => g.classList.toggle("on", caseOn.has(c.id)));
  let html = `<div class="code">${code}</div><h2>${s.title}</h2>`;
  if (s.role) html += `<div class="role">${s.role}</div>`;
  if (s.groups) html += `<div style="height:14px"></div>` + s.groups.map((g) => `<div class="grp"><div class="k">${g.k}</div><div class="v">${g.v}</div></div>`).join("");
  if (s.show) html += `<h3>${L.show}</h3>${li(s.show)}` + (s.menu ? `<h3>${L.menu}</h3><div class="menu">${s.menu}</div>` : "");
  if (PH.some(([k]) => s[k])) html += `<div style="height:10px"></div>` + PH.filter(([k]) => s[k]).map(([k, label, color]) =>
    `<div class="phase" style="border-color:${color}"><div class="k" style="color:${color}">${label}</div><div class="v">${s[k]}</div></div>`).join("");
  const med = (window.MEDIA || {})[s.id];
  if (LIVE && med) {
    const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    html += `<div class="media">${med.shot ? `<img src="${med.shot}" data-zoom="${med.shot}" alt="${med.caption}"><div class="cap">${L.shot}: ${med.caption}</div>` : ""}
      <button class="watch" data-play="${med.t}">▶ ${L.watch} (${mmss(med.t)})</button></div>`;
  }
  if (LIVE) {
    const i = STEP_IDS.indexOf(s.id), prev = STEPS[i - 1], next = STEPS[i + 1];
    const b = (x, arrow) => x ? `<button data-go="${x.id}">${arrow === "←" ? "← " : ""}${x.id === FIRST ? (x.code || L.map) : x.id} · ${x.title}${arrow === "→" ? " →" : ""}</button>` : "<button hidden></button>";
    html += `<div class="pager">${b(prev, "←")}${b(next, "→")}</div>`;
    document.querySelectorAll("#strip button").forEach((x) => x.classList.toggle("cur", x.dataset.go === s.id));
  }
  document.getElementById("panel").innerHTML = html;
  document.title = s.id === FIRST ? P.title : `${s.id} · ${s.title}`;
}

// bbox (page px) of the highlighted items, for the zoom in the video
window.markerBox = () => {
  const els = [...document.querySelectorAll(".on")];
  if (!els.length) return null;
  const r = els.map((e) => e.getBoundingClientRect());
  const x = Math.min(...r.map((b) => b.left)), y = Math.min(...r.map((b) => b.top));
  return { x: Math.round(x), y: Math.round(y), w: Math.round(Math.max(...r.map((b) => b.right)) - x), h: Math.round(Math.max(...r.map((b) => b.bottom)) - y) };
};
window.STEP_IDS = STEPS.map((s) => s.id);

// static texts from the process file
document.documentElement.lang = P.lang || "en";
document.getElementById("kicker").innerHTML = `${P.kicker || ""} <b>${P.heading}</b>`;
document.getElementById("footnote").textContent = P.footnote || "";
document.getElementById("mclose").textContent = L.close;
const themeBtn = document.getElementById("theme"), root = document.documentElement;
const paintTheme = () => { const dark = root.dataset.theme === "dark";
  themeBtn.textContent = dark ? "☀" : "☾"; themeBtn.title = themeBtn.ariaLabel = `${L.theme || "Theme"}: ${dark ? "light" : "dark"}`; };
themeBtn.onclick = () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("pf-theme", root.dataset.theme); } catch (e) {} paintTheme(); };
matchMedia("(prefers-color-scheme: light)").addEventListener("change", (e) => {  // follow the OS until a choice is saved
  let saved = null; try { saved = localStorage.getItem("pf-theme"); } catch (x) {}
  if (!saved && !Q.has("theme")) { root.dataset.theme = e.matches ? "light" : "dark"; paintTheme(); } });
paintTheme();
document.querySelectorAll("[data-l]").forEach((x) => { x.textContent = P.legend?.[x.dataset.l] ?? ""; if (!x.textContent) x.parentElement.remove(); });
draw();
let cur = Q.get("step") || FIRST;
const go = (id, push = true) => {
  if (!STEP_IDS.includes(id)) return;
  cur = id;
  if (push) history.pushState(null, "", "?step=" + id);
  render(id);
};
if (LIVE) {
  document.documentElement.classList.add("live");
  document.body.classList.add("live");
  // a node opens the first chapter that shows it (case chapters last); a case pill opens that case
  const shows = (s, id) => (s.focus || []).includes(id) && !s.allCases;
  const nodeStep = (id) => (STEPS.find((s) => shows(s, id) && !isCase(s)) || STEPS.find((s) => shows(s, id)) || STEPS[0]).id;
  NODES.forEach((n) => { n.el.addEventListener("click", () => go(nodeStep(n.id))); el("title", {}, n.el, "Buka " + nodeStep(n.id)); });
  CASES.forEach((c) => c.els.forEach((g) => { g.addEventListener("click", () => go(c.id)); el("title", {}, g, "Buka kasus " + c.id); }));
  document.getElementById("strip").innerHTML = STEPS.map((s, i) =>
    `${i && (s.section !== STEPS[i - 1].section || s.group !== STEPS[i - 1].group) ? '<span class="gap"></span>' : ""}<button data-go="${s.id}" title="${s.title}">${s.id === FIRST ? L.map : s.id}</button>`).join("");
  document.addEventListener("click", (ev) => { const t = ev.target.closest("[data-go]"); if (t) go(t.dataset.go); });
  // player / zoom: the modal sits outside the scaled body, so it uses the real window size
  const modal = document.getElementById("modal"), mbody = document.getElementById("mbody");
  document.documentElement.appendChild(modal);
  const open = (inner, cap) => { mbody.innerHTML = inner; document.getElementById("mcap").textContent = cap; modal.classList.add("open"); };
  const close = () => { modal.classList.remove("open"); mbody.innerHTML = ""; };
  document.getElementById("mclose").onclick = close;
  modal.addEventListener("click", (ev) => { if (ev.target === modal) close(); });
  document.addEventListener("click", (ev) => {
    const p = ev.target.closest("[data-play]"), z = ev.target.closest("[data-zoom]");
    const s = STEPS.find((x) => x.id === cur);
    if (p) {
      open(`<video controls autoplay src="${MEDIA._video.src}#t=${p.dataset.play}"></video>`, `${cur} · ${s.title}`);
    } else if (z) open(`<img src="${z.dataset.zoom}">`, `${cur} · ${MEDIA[cur].caption}`);
  });
  addEventListener("keydown", (ev) => { if (ev.key === "Escape" && modal.classList.contains("open")) { ev.stopImmediatePropagation(); close(); } }, true);
  addEventListener("popstate", () => go(new URLSearchParams(location.search).get("step") || FIRST, false));
  // fill the window: scale to the limiting side, then widen/heighten the canvas into the spare space
  const fit = () => {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080), b = document.body.style;
    b.width = innerWidth / k + "px"; b.height = innerHeight / k + "px"; b.transform = `scale(${k})`;
  };
  addEventListener("resize", fit); fit();
}
render(cur);
addEventListener("keydown", (ev) => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
  if (d) go(STEP_IDS[(STEP_IDS.indexOf(cur) + d + STEP_IDS.length) % STEP_IDS.length]);
  if (ev.key === "Escape") go(FIRST);
});
</script>
</body>
